<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Имкон · Платформа возможностей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  /* ---- бэкдроп сайта ---- */
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1100px 720px at 82% -12%, #ECECFB 0%, transparent 58%),
      radial-gradient(900px 600px at -12% 112%, #EAF0FB 0%, transparent 55%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:28px;gap:42px}
  .brandside{max-width:340px}
  .brandside .logo{display:flex;align-items:center;gap:12px}
  .brandside h1{font:600 40px/1.05 var(--font-head);color:var(--ink);margin:18px 0 0}
  .brandside p{font:400 16px/1.55 var(--font-ui);color:var(--text-3);margin-top:12px}
  .brandside .feats{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .brandside .feat{display:flex;gap:10px;align-items:flex-start;font:500 14px var(--font-ui);color:var(--text-2)}
  .brandside .feat b{color:var(--ink);font-weight:600}
  .brandside .dot{width:9px;height:9px;border-radius:99px;margin-top:5px;flex-shrink:0}

  /* ---- телефон-приложение ---- */
  .device{position:relative}
  .phone{position:relative;width:var(--phone-w);height:var(--phone-h);background:var(--bg);
    border:var(--bw-frame) solid var(--ink);border-radius:var(--r-phone);overflow:hidden;
    display:flex;flex-direction:column;box-shadow:var(--sh-phone);color:var(--ink-2)}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{width:0}
  .langfab{position:absolute;top:-14px;right:0;transform:translateY(-100%)}

  /* экранная анимация */
  .screen > .view{animation:imkonRise .34s cubic-bezier(.2,.8,.2,1) both}

  /* служебные */
  .top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 0;font:600 12px var(--font-ui);color:var(--ink)}
  .top .dots{letter-spacing:2px}
  .hd{display:flex;align-items:center;gap:14px;padding:16px 22px 0}
  .hd .back{cursor:pointer;display:flex}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
  .muted{color:var(--muted)}
  .pad{padding:0 var(--sp-7)}
  .foot{padding:14px var(--sp-7) var(--sp-8);display:flex;flex-direction:column;gap:11px}
  .listgap{display:flex;flex-direction:column;gap:11px}
  a.plain{text-decoration:none;color:inherit}

  /* тост */
  .toast{position:absolute;left:18px;right:18px;bottom:84px;background:var(--ink);color:var(--bg);
    font:600 14px var(--font-ui);padding:14px 16px;border-radius:14px;box-shadow:var(--sh-node);
    opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;text-align:center;z-index:5}
  .toast.show{opacity:1;transform:translateY(0)}

  /* AI-чат */
  .bubble{max-width:80%;padding:12px 14px;border-radius:16px;font:400 14px/1.4 var(--font-ui)}
  .bubble.ai{background:#fff;border:1px solid var(--line-card);border-bottom-left-radius:5px;align-self:flex-start;color:var(--ink)}
  .bubble.me{background:var(--teal);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}

  @media (max-width:880px){
    body{padding:0;gap:0}
    .brandside{display:none}
    .device{width:100%;height:100%}
    .phone{width:100vw;height:100dvh;border:none;border-radius:0}
    .langfab{top:auto;bottom:74px;right:14px;transform:none}
  }

  /* ====== ПЛАВНОСТЬ: вход экрана ====== */
  .screen > .view{animation:imkonViewIn .44s cubic-bezier(.2,.85,.25,1) both;will-change:transform,opacity}
  @keyframes imkonViewIn{from{opacity:0;transform:translateY(13px) scale(.992)}to{opacity:1;transform:none}}
  .screen.back > .view{animation:imkonViewBack .44s cubic-bezier(.2,.85,.25,1) both}
  @keyframes imkonViewBack{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  /* мягкие транзишены на интерактиве */
  .im-filter,.im-tab,.im-chip,.im-option,.seg button,.gph-dot{transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s cubic-bezier(.2,.85,.25,1)}
  .im-filter:active,.im-tab:active{transform:scale(.96)}

  /* ====== Bottom sheet ====== */
  .sheet-wrap{position:absolute;inset:0;z-index:8;display:none}
  .sheet-wrap.show{display:block}
  .sheet-scrim{position:absolute;inset:0;background:rgba(20,33,31,.42);opacity:0;transition:opacity .3s ease}
  .sheet-wrap.show .sheet-scrim{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;
    padding:9px 22px 24px;box-shadow:0 -12px 44px -14px rgba(20,33,31,.45);transform:translateY(101%);
    transition:transform .36s cubic-bezier(.2,.85,.25,1)}
  .sheet-wrap.show .sheet{transform:none}
  .sheet .grip{width:40px;height:4px;border-radius:99px;background:var(--line-input);margin:0 auto 16px}

  /* ====== AI «печатает» ====== */
  .typing{display:inline-flex;gap:5px;padding:14px 16px;background:#fff;border:1px solid var(--line-card);
    border-radius:16px;border-bottom-left-radius:5px;align-self:flex-start;animation:imkonViewIn .3s both}
  .typing i{width:7px;height:7px;border-radius:99px;background:var(--muted)}
  .typing i{animation:imkonBlink 1.25s infinite both}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes imkonBlink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .bubble{animation:imkonViewIn .34s cubic-bezier(.2,.85,.25,1) both}

  /* ====== Obsidian-граф «Мой путь» ====== */
  .gph{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;
    background:radial-gradient(420px 320px at 28% 18%, #efe7d4 0%, transparent 60%),
               radial-gradient(360px 300px at 88% 92%, #e7efe9 0%, transparent 60%), var(--bg)}
  .gph.drag{cursor:grabbing}
  .gph-stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .gph-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .gph-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:7px;
    transform:translate(-50%,-50%);cursor:pointer;-webkit-user-select:none;user-select:none;
    animation:imkonPop .5s cubic-bezier(.2,.9,.3,1.25) both}
  @keyframes imkonPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}60%{transform:translate(-50%,-50%) scale(1.07)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .gph-node:nth-of-type(1){animation-delay:.05s}.gph-node:nth-of-type(2){animation-delay:.12s}
  .gph-node:nth-of-type(3){animation-delay:.19s}.gph-node:nth-of-type(4){animation-delay:.26s}
  .gph-node:nth-of-type(5){animation-delay:.33s}.gph-node:nth-of-type(6){animation-delay:.40s}
  .gph-node:nth-of-type(7){animation-delay:.47s}
  .gph-edges{animation:imkonEdgeIn .6s ease .12s both}
  @keyframes imkonEdgeIn{from{opacity:0}to{opacity:1}}
  .gph-dot{width:46px;height:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    border:3px solid var(--line-input);background:var(--surface-sunk);color:var(--muted-2);box-shadow:var(--sh-card)}
  .gph-node:active .gph-dot{transform:scale(.9)}
  .gph-node[data-st="done"]    .gph-dot{background:var(--gold); border-color:var(--gold); color:#fff;box-shadow:var(--sh-node)}
  .gph-node[data-st="current"] .gph-dot{background:var(--teal); border-color:var(--teal); color:#fff;width:64px;height:64px;box-shadow:var(--sh-node);animation:imkonPulse 2.2s infinite}
  .gph-node[data-st="goal"]    .gph-dot{background:var(--terra);border-color:var(--terra);color:#fff;width:56px;height:56px;box-shadow:var(--sh-node)}
  .gph-lbl{font:600 11px var(--font-ui);color:var(--text-2);max-width:96px;text-align:center;line-height:1.25;
    background:rgba(247,242,233,.72);padding:2px 7px;border-radius:8px;backdrop-filter:blur(2px)}
  .gph-node[data-st="locked"] .gph-lbl{color:var(--muted-2)}
  .gph-node[data-st="current"] .gph-lbl{color:var(--ink);font-weight:700}
  .gph-zoom{position:absolute;right:14px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:4}
  .gph-zoom button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);font:600 19px var(--font-ui);cursor:pointer;box-shadow:var(--sh-card);display:flex;align-items:center;justify-content:center}
  .gph-zoom button:active{transform:scale(.92)}
  .gph-hint{position:absolute;left:14px;top:12px;z-index:4;font:600 11px var(--font-ui);color:var(--muted);
    background:rgba(247,242,233,.82);padding:6px 12px;border-radius:99px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(3px);pointer-events:none}
  .gph-hint .pin{width:7px;height:7px;border-radius:99px;background:var(--teal)}

  /* ====== Segmented (граф/список) ====== */
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
  .seg button{font:600 12px var(--font-ui);padding:7px 15px;border:none;border-radius:99px;background:transparent;color:var(--text-3);cursor:pointer}
  .seg button.on{background:var(--ink);color:var(--bg)}

  /* ====== AI-герой на главной ====== */
  .ai-hero{position:relative;overflow:hidden;background:var(--surface);border:1.5px solid var(--teal-border);border-radius:20px;padding:18px 17px;box-shadow:var(--sh-card)}
  .ai-hero::before{content:"";position:absolute;top:-46px;right:-34px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(91,91,214,.16),transparent 70%);pointer-events:none}
  .ai-hero .avatar{width:40px;height:40px;border-radius:99px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--sh-node);flex-shrink:0}
  .ai-hero-q{font:600 22px/1.18 var(--font-head);color:var(--ink);margin-top:14px;position:relative}
  .ai-ask{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--surface-sunk);border:1.5px solid var(--line-input);border-radius:14px;padding:12px 12px;cursor:pointer;transition:border-color .18s ease}
  .ai-ask:hover{border-color:var(--teal)}
  .ai-ask .ph{flex:1;font:500 14px var(--font-ui);color:var(--muted)}
  .ai-ask .go{width:34px;height:34px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}

  /* ====== Работа: теги, бейдж, карточка ====== */
  .im-tag{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--font-ui);color:var(--text-3);background:var(--surface-sunk);border:1px solid var(--line);padding:5px 9px;border-radius:8px;white-space:nowrap}
  .im-badge-new{font:700 9px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--teal);padding:2px 7px;border-radius:99px}
  .im-job{transition:transform .14s cubic-bezier(.2,.85,.25,1),border-color .15s ease}
  .im-job:active{transform:scale(.99)}
  .im-job:hover{border-color:var(--teal-border)}

  /* ====== Главная: статы ====== */
  .stat{flex:1;background:var(--surface);border:1px solid var(--line-card);border-radius:14px;padding:12px 13px}
  .stat .n{font:700 22px var(--font-head);line-height:1}
  .stat .l{font:600 10px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:5px}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

  <!-- левая колонка-бренд (десктоп) -->
  <aside class="brandside">
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none"><rect x="3" y="3" width="42" height="42" rx="13" fill="#5B5BD6"/><path d="M24 13l2.6 7.4L34 23l-7.4 2.6L24 33l-2.6-7.4L14 23l7.4-2.6L24 13z" fill="#fff"/></svg>
      <div style="font:700 26px var(--font-head);color:var(--ink)">Имкон</div>
    </div>
    <h1 data-i18n="brand_h">Возможности находят тебя</h1>
    <p data-i18n="brand_p">Платформа возможностей для молодёжи Таджикистана: стипендии, курсы, работа и путь до реальной профессии.</p>
    <div class="feats">
      <div class="feat"><span class="dot" style="background:var(--teal)"></span><span><b>AI-путь</b> — построим дорогу шаг за шагом до работы</span></div>
      <div class="feat"><span class="dot" style="background:var(--gold)"></span><span><b>Паспорти Эътимод</b> — достижения, которым верит работодатель</span></div>
      <div class="feat"><span class="dot" style="background:var(--terra)"></span><span><b>Работа и подработки</b> — вакансии, гиги, фриланс</span></div>
    </div>
  </aside>

  <!-- устройство -->
  <div class="device">
    <div class="langfab">
      <div class="im-pills">
        <button class="im-pill" data-lang="tg">Тоҷикӣ</button>
        <button class="im-pill is-on" data-lang="ru">Русский</button>
      </div>
    </div>
    <div class="phone">
      <div class="top"><span>9:41</span><span class="dots">●●●</span></div>
      <div class="screen" id="screen"></div>
      <nav class="im-nav" id="nav" hidden></nav>
      <div class="toast" id="toast"></div>
      <div class="sheet-wrap" id="sheet"></div>
    </div>
  </div>

<script>
/* ============================================================
   ИМКОН · интерактивный прототип (frontend only, без бэкенда)
   Данные и тексты — из исходного канваса. Состояние в localStorage.
   ============================================================ */

/* ---------- иконки ---------- */
/* Чистый Lucide-стиль: ровный тонкий штрих 24×24 */
const IC = {
  book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z',
  code:'M16 18l6-6-6-6M8 6l-6 6 6 6',
  scale:'M16 16l3-8 3 8c-2 1.5-4 1.5-6 0M2 16l3-8 3 8c-2 1.5-4 1.5-6 0M7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2',
  cross:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
  hands:'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7z',
  coin:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v12M15.5 9a3.5 3 0 0 0-3.5-2c-2 0-3.2 1-3.2 2.3 0 1.5 1.2 2 3.7 2.7s3.7 1.2 3.7 2.7c0 1.3-1.2 2.3-3.2 2.3a3.5 3 0 0 1-3.5-2',
  work:'M4 7h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18',
  puzzle:'M9.5 2a2 2 0 0 1 2 2c0 .5-.2 1-.5 1.5h3a1 1 0 0 1 1 1v3c.5-.3 1-.5 1.5-.5a2 2 0 1 1 0 4c-.5 0-1-.2-1.5-.5v3a1 1 0 0 1-1 1h-3c.3.5.5 1 .5 1.5a2 2 0 1 1-4 0c0-.5.2-1 .5-1.5h-3a1 1 0 0 1-1-1v-3c-.5.3-1 .5-1.5.5a2 2 0 1 1 0-4c.5 0 1 .2 1.5.5V6.5a1 1 0 0 1 1-1h3C7.7 5 7.5 4.5 7.5 4a2 2 0 0 1 2-2z',
  globe:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20',
  react:'M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
  server:'M3 5h18a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM3 14h18a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1zM6 7.5h.01M6 16.5h.01',
  flag:'M4 21V4M4 4h13l-2.5 4L17 12H4',
  check:'M5 12l4.5 4.5L19 7',
  up:'M3 17l6-6 4 4 8-8M15 7h6v6',
  home:'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5',
  path:'M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 17h6a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h5',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6.5 8-6.5s8 2.5 8 6.5',
  bell:'M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 0 0 4 0',
  send:'M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z',
  arrow:'M15 18l-6-6 6-6',
  lock:'M5 11a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8zM8 10V7a4 4 0 0 1 8 0v3',
  cap:'M22 10 12 5 2 10l10 5 10-5zM6 12v5c0 1.5 2.7 2.5 6 2.5s6-1 6-2.5v-5M22 10v6',
  spark:'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3zM18.5 13.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z',
  eye:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  spark2:'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z',
  crown:'M4 18h16M5 18l-1-9 5 4 3-7 3 7 5-4-1 9',
  filter:'M3 5h18l-7 8v6l-4 2v-8z',
  pin:'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
  star:'M12 3l2.9 6.3 6.6.6-5 4.4 1.5 6.6L12 17.8 5.5 21l1.5-6.6-5-4.4 6.6-.6z'
};
/* ---------- лого компаний/организаций (фирменные монограммы) ---------- */
function brandFor(org){const o=(org||'').toLowerCase();
  if(o.includes('alif'))return{bg:'#7A2FF6',t:'a'};
  if(o.includes('megafon')||o.includes('мегафон'))return{bg:'#1FA84B',t:'M'};
  if(o.includes('zypl'))return{bg:'#111118',t:'z'};
  if(o.includes('babilon'))return{bg:'#E23B2E',t:'B'};
  if(o.includes('oson'))return{bg:'#F7941D',t:'O'};
  if(o.includes('spitamen'))return{bg:'#0E7C66',t:'S'};
  if(o.includes('dc'))return{bg:'#2563EB',t:'DC',fs:.3};
  if(o.includes('илмхона')||o.includes('ilmhona'))return{bg:'#16A34A',t:'И'};
  if(o.includes('ielts'))return{bg:'#B5121B',t:'IE',fs:.3};
  if(o.includes('sitora')||o.includes('ситора'))return{bg:'#CA8A04',t:'S'};
  if(o.includes('codecademy'))return{bg:'#1F2937',t:'C'};
  if(o.includes('bootcamp'))return{bg:'#5B5BD6',t:'B'};
  if(o.includes('президент')||o.includes('минобр')||o.includes('маориф')||o.includes('вазорат')||o.includes('донишгоҳ')||o.includes('университ')||o.includes('славян')||o.includes('технич')||o.includes('ттс'))return{bg:'#1E7A34',glyph:1};
  return{bg:'#3A3A46',t:(o.replace(/[^a-zа-яё]/i,'')[0]||'?').toUpperCase()};
}
function logo(org,{s=44,r=12}={}){const b=brandFor(org);const fs=Math.round(s*(b.fs||0.4));
  const inner=b.glyph?svg('crown',{s:Math.round(s*0.5),c:'#F4C430'})
    :`<span style="font:800 ${fs}px/1 var(--font-head);letter-spacing:-.02em;color:#fff">${b.t}</span>`;

/* ---------- граф «Мой путь»: тап по узлу ---------- */
let _graph=null;
function openNodeSheet(id){const n=_graph&&_graph[id];if(!n)return;const p=T().p;
  const ncls=n.state==='done'?'im-node--done':n.state==='current'?'im-node--current':n.state==='goal'?'im-node--goal':'';
  const stxt={done:p.node_done,current:p.here,locked:p.node_lock,goal:p.node_goal}[n.state]||'';
  const stcol=n.state==='current'?'var(--teal)':n.state==='goal'?'var(--terra)':n.state==='done'?'var(--gold)':'var(--muted)';
  const cta=n.state==='current'?`<button class="im-btn im-btn--primary" data-action="toast" data-msg="${p.take} ✓" data-sheet-close>${p.take}</button>`
    :n.state==='goal'?`<div class="im-card im-card--warm" style="display:flex;align-items:center;justify-content:center;gap:7px;font:600 14px var(--font-ui);color:var(--terra)">${svg('flag',{s:16,c:'var(--terra)'})} ${p.finish}</div>`
    :n.state==='locked'?`<button class="im-btn im-btn--ghost" style="opacity:.65;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:7px">${svg('lock',{s:16,c:'var(--muted)'})}${p.l_lock}</button>`
    :`<button class="im-btn im-btn--outline" data-sheet-close>${T().c.done}</button>`;
  openSheet(`<div class="im-row" style="gap:13px">
      <div class="im-node ${ncls}" style="width:46px;height:46px;animation:none">${nodeIcon(n)}</div>
      <div style="flex:1"><div class="im-title" style="font-size:17px">${n.title}</div><div class="im-meta" style="margin-top:3px">${n.course||''}${n.time?' · '+n.time:''}</div></div>
    </div>
    <div style="margin-top:12px;font:600 12px var(--font-ui);color:${stcol}">${stxt}</div>
    <div style="margin-top:14px">${cta}</div>`);
}
function initGraph(){
  const gph=document.getElementById('gph');const stage=document.getElementById('gphStage');if(!gph||!stage)return;
  const GM=graphModel(S.lang);_graph={};GM.nodes.forEach(n=>_graph[n.id]=n);
  let scale=1,tx=0,ty=0,down=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  const clamp=s=>Math.min(1.9,Math.max(.55,s));
  const SMOOTH='transform .42s cubic-bezier(.2,.85,.25,1)';
  const apply=(smooth)=>{stage.style.transition=smooth?SMOOTH:'none';stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`};
  function fit(){const r=gph.getBoundingClientRect();const pad=44;
    scale=clamp(Math.min((r.width-2*pad)/GM.w,(r.height-2*pad)/GM.h,1));
    tx=(r.width-GM.w*scale)/2;ty=(r.height-GM.h*scale)/2+4;apply(true);}
  function zoomAt(cx,cy,f,smooth){const ns=clamp(scale*f);tx=cx-(cx-tx)*(ns/scale);ty=cy-(cy-ty)*(ns/scale);scale=ns;apply(smooth);}
  requestAnimationFrame(fit);
  if(window._gphMove){window.removeEventListener('pointermove',window._gphMove);window.removeEventListener('pointerup',window._gphUp);}
  gph.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;gph.classList.add('drag');});
  window._gphMove=e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;tx=ox+dx;ty=oy+dy;apply(false);};
  window._gphUp=()=>{down=false;gph.classList.remove('drag');};
  window.addEventListener('pointermove',window._gphMove);window.addEventListener('pointerup',window._gphUp);
  gph.addEventListener('wheel',e=>{e.preventDefault();const r=gph.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12,false);},{passive:false});
  gph.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();const z=+b.dataset.zoom;if(z===0)return fit();const r=gph.getBoundingClientRect();zoomAt(r.width/2,r.height/2,z>0?1.18:1/1.18,true);}));
  stage.querySelectorAll('.gph-node').forEach(nd=>nd.addEventListener('click',()=>{if(moved)return;openNodeSheet(nd.dataset.node);}));
}

/* --- Path: модель графа --- */
function graphModel(lang){
  const sp=DATA.path[lang], ex=DATA.graphExtra[lang];
  // координаты подобраны вручную — органичный, не ровный граф
  const P={s0:[96,82],s1:[236,156],s2:[138,300],ts:[56,432],s3:[290,392],proj:[252,524],s4:[170,616]};
  const N=[['s0',sp[0]],['s1',sp[1]],['s2',sp[2]],['ts',ex[0]],['s3',sp[3]],['proj',ex[1]],['s4',sp[4]]]
    .map(([id,d])=>({id,...d,x:P[id][0],y:P[id][1]}));
  const E=[['s0','s1','gold'],['s1','s2','teal'],['s2','ts','beige'],['s2','s3','beige'],['ts','proj','beige'],['s3','proj','beige'],['proj','s4','beige']];
  return {nodes:N,edges:E,w:360,h:690};
}
function nodeIcon(n){return n.state==='done'?svg('check',{c:'#fff',w:2.4}):n.state==='locked'?svg('lock',{c:'var(--muted-2)'}):n.state==='goal'?svg('flag',{c:'#fff'}):svg(n.ic,{c:'#fff'})}
function edgeD(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,o=.13;return `M${a.x} ${a.y} Q${mx-dy*o} ${my+dx*o} ${b.x} ${b.y}`}
function legendDot(c,t){return `<span style="display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font-ui);color:var(--text-3)"><i style="width:9px;height:9px;border-radius:9px;background:${c};display:inline-block"></i>${t}</span>`}

  const head=`<div class="pad" style="padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px">

  if(graph){
    const GM=graphModel(S.lang);const byId={};GM.nodes.forEach(n=>byId[n.id]=n);
    const col={gold:'var(--gold)',teal:'var(--teal)',beige:'var(--line-input)'};
    const edges=GM.edges.map(([a,b,k])=>`<path d="${edgeD(byId[a],byId[b])}" stroke="${col[k]}" stroke-width="${k==='beige'?2.5:3.5}" fill="none" stroke-linecap="round" ${k==='beige'?'stroke-dasharray="0.5 9"':''}/>`).join('');
    const nodes=GM.nodes.map(n=>`<div class="gph-node" data-st="${n.state}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="gph-dot">${nodeIcon(n)}</div><div class="gph-lbl">${n.title}</div></div>`).join('');
    return `<div class="view" style="height:100%;display:flex;flex-direction:column">
     ${head}
     <div class="pad" style="margin-top:8px;display:flex;align-items:center;gap:13px;flex-wrap:wrap">
       <span class="im-meta">${p.passed}: ${passed}/${total}</span>
       ${legendDot('var(--gold)',p.l_done)}${legendDot('var(--teal)',p.l_cur)}${legendDot('var(--terra)',p.l_goal)}
     </div>
     <div class="gph" id="gph">
       <div class="gph-hint"><span class="pin"></span>${p.tap}</div>
       <div class="gph-stage" id="gphStage">
         <svg class="gph-edges" width="${GM.w}" height="${GM.h}">${edges}</svg>
         ${nodes}
       </div>
       <div class="gph-zoom">
         <button data-zoom="1">+</button><button data-zoom="-1">−</button>
         <button data-zoom="0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke-linecap="round"/></svg></button>
       </div>
     </div></div>`;
  }
  return `<div class="view" style="display:flex;flex-direction:column">
   ${head}
   <div class="pad" style="margin-top:8px"><div class="im-meta">${p.passed}: ${passed} / ${total}</div><div class="im-progress" style="margin-top:6px"><i style="width:${passed/total*100}%"></i></div></div>
   <div class="pad listgap" style="padding-top:18px;padding-bottom:20px">
   ${steps.map((s,i)=>{const cur=s.state==='current';const cls=s.state==='done'?'im-node--done':cur?'im-node--current':s.state==='goal'?'im-node--goal':'';
     const ico=nodeIcon(s);
     return `<div style="display:flex;gap:14px;align-items:flex-start">
       <div style="display:flex;flex-direction:column;align-items:center">
         <div class="im-node ${cls}" style="width:44px;height:44px">${ico}</div>
         ${i<steps.length-1?`<div class="im-seg ${s.state==='done'?'im-seg--gold':''}" style="height:34px"></div>`:''}
       </div>
       <div class="im-card ${s.state==='goal'?'im-card--warm':cur?'im-card--tint':''}" style="flex:1">
         <div class="im-title" style="font-size:15px;color:${s.state==='locked'?'var(--muted)':'var(--ink)'}">${s.title}</div>
         <div class="im-meta" style="margin-top:3px">${s.course}${s.time?' · '+s.time:''}</div>
         ${cur?`<div style="margin-top:8px"><span class="im-here">${p.here}</span></div><button class="im-btn im-btn--primary im-btn--sm" style="margin-top:10px;width:100%" data-action="toast" data-msg="${p.take} ✓">${p.take}</button>`:''}
         ${s.state==='goal'?`<div class="im-meta" style="margin-top:6px;color:var(--terra);font-weight:600;display:flex;align-items:center;gap:6px">${svg('flag',{s:14,c:'var(--terra)'})} ${p.finish}</div>`:''}
       </div></div>`}).join('')}
   <button class="im-btn im-btn--outline" style="margin-top:6px" data-action="toast" data-msg="${p.share} ✓">${p.share}</button>
   </div>
   </div>`};

function workFilter(list){return list.filter(j=>{
  if(S.workSphere!=='Все' && j.sph!==S.workSphere) return false;
  if(S.wf.company && j.org!==S.wf.company) return false;

function workCard(j,tab,idx){const wk=T().wk;const isJob=tab===0;
  const payTxt = tab===1 ? `${j.pay} ${wk.cur}${wk.month}` : `${j.pay} ${wk.cur}`;

  return `<div class="im-card im-job" ${isJob?`data-job="${idx}"`:''} style="${isJob?'cursor:pointer':''}">

  </div>`;}

     <div class="im-meta" style="margin-top:3px">${uni.city} · ${uni.dir}</div>
     <div class="im-grid-2" style="margin-top:12px;gap:8px">
       <div class="im-card im-card--sunk" style="padding:10px 12px"><div class="im-meta">${u.score}</div><div style="font:700 17px var(--font-head);color:var(--ink)">${uni.score}</div></div>
       <div class="im-card im-card--sunk" style="padding:10px 12px"><div class="im-meta">${u.cost}</div><div style="font:600 14px var(--font-ui);color:var(--ink)">${uni.cost}</div></div>
     </div>
     <div class="im-spread" style="margin-top:12px">${uni.sch?`<span class="im-chip im-chip--on">${svg('cap',{s:14,c:'var(--teal)'})} ${u.sch}</span>`:'<span></span>'}<button class="im-btn im-btn--primary im-btn--sm" data-action="toast" data-msg="${u.added}">${u.add}</button></div>
   </div>`).join('')}</div></div>`};

/* --- Org cabinet --- */
V['settings-org']=()=>V.org();
V.org=()=>{const o=T().org;const list=DATA.verify[S.lang].filter((_,i)=>!(S._handled||[]).includes(i));
  return `<div class="view">${backBtn('profile')}
   <div class="pad"><div class="im-q" style="font-size:22px">${o.title}</div><div class="im-meta" style="margin-top:6px">${o.who}</div>
   <div class="im-card im-card--tint" style="margin-top:14px;font:600 13px var(--font-ui);color:var(--teal)">${o.sub}</div>
   <div class="listgap" style="margin-top:14px;padding-bottom:18px">${list.length?list.map(v=>{const idx=DATA.verify[S.lang].indexOf(v);return `<div class="im-card">
     <div style="display:flex;gap:11px;align-items:flex-start"><div style="width:40px;height:40px;border-radius:99px;background:var(--surface-tint);display:flex;align-items:center;justify-content:center;font:700 15px var(--font-head);color:var(--teal)">${v.name[0]}</div>
       <div style="flex:1"><div style="font:600 14px var(--font-ui)">${v.name}</div><div class="im-meta" style="margin-top:2px">${o.req}</div><div class="im-meta" style="margin-top:4px;color:var(--ink)">${v.course}</div><div class="im-meta" style="margin-top:2px;color:var(--muted-2)">${v.when}</div></div></div>
     <div class="im-btn-row" style="margin-top:12px"><button class="im-btn im-btn--ghost im-btn--grow" data-handle="${idx}" data-ok="0">${o.reject}</button><button class="im-btn im-btn--primary im-btn--grow" data-handle="${idx}" data-ok="1">${o.confirm}</button></div>
   </div>`}).join(''):`<div class="center" style="padding:40px 0"><div style="font:600 16px var(--font-head);color:var(--teal)">${o.empty}</div></div>`}</div></div></div>`};

/* --- Notifications --- */
V.notifs=()=>{const nt=T().nt;return `<div class="view">${backBtn('home')}
  <div class="pad"><div class="im-q" style="font-size:22px">${nt.title}</div>
   <div class="listgap" style="margin-top:18px;padding-bottom:18px">${DATA.notifs.map((n,i)=>`<div class="im-card" style="display:flex;gap:12px;align-items:flex-start">
     <div style="width:40px;height:40px;border-radius:12px;background:${n.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0">${svg(n.ic,{s:18,c:'#fff'})}</div>
     <div style="flex:1"><div style="font:600 14px var(--font-ui);color:var(--ink)">${nt[n.k]}</div><div class="im-meta" style="margin-top:3px">${nt[n.k+'s']}</div></div>
     <div class="im-meta" style="white-space:nowrap">${nt.ago[i]}</div>
   </div>`).join('')}</div></div></div>`};

/* ====================================================================
   РЕНДЕР + НАВИГАЦИЯ
   ==================================================================== */
const MAIN={home:1,path:1,work:1,uni:1,profile:1};
function render(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('.langfab .im-pill').forEach(p=>p.classList.toggle('is-on',p.dataset.lang===S.lang));
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=T()[el.dataset.i18n];if(v)el.textContent=v});
  const scr=S.screen;
  // закрыть открытый шит при смене экрана
  const sw=document.getElementById('sheet');if(sw){sw.classList.remove('show');sw.innerHTML=''}
  screenEl().innerHTML=(V[scr]||V.welcome)();
  screenEl().scrollTop=0;
  // нижняя навигация только в основном приложении
  const showNav=S.registered && MAIN[scr];
  const nv=navEl();nv.hidden=!showNav;
  if(showNav){const n=T().nav;const tabs=[['home','home',n.home],['path','path',n.path],['work','work',n.work],['uni','cap',n.uni],['profile','user',n.profile]];
    nv.innerHTML=tabs.map(([k,ic,lbl])=>`<a class="plain ${scr===k?'is-on':''}" data-go="${k}">${svg(ic,{s:22})}${lbl}</a>`).join('');}
  // пост-рендер: интерактив графа и AI-чата
  if(scr==='path' && S.goal && S.pathView!=='list') initGraph();
  if(scr==='ai') initAI();
  save();
}

/* ---------- обработчик кликов ---------- */
document.body.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-action],[data-pick],[data-toggle],[data-filter],[data-worktab],[data-sphere],[data-job],[data-jf],[data-pathview],[data-lang],[data-opp],[data-ai],[data-handle],[data-sheet-close]');
  if(!t)return;
  // закрыть шит (не мешает действию на той же кнопке)
  if(t.hasAttribute('data-sheet-close'))closeSheet();
  // язык
  if(t.dataset.lang){S.lang=t.dataset.lang;render();return}
  // навигация
  if(t.dataset.go){go(t.dataset.go);return}
  // открыть возможность
  if(t.dataset.opp!=null){S.oppIndex=+t.dataset.opp;go('opp');return}
  // фильтр ленты
  if(t.dataset.filter!=null){S.filter=+t.dataset.filter;render();return}
  // таб работы
  if(t.dataset.worktab!=null){S.workTab=+t.dataset.worktab;render();return}
  // чип сферы
  if(t.dataset.sphere){S.workSphere=t.dataset.sphere;render();return}
  // открыть вакансию
  if(t.dataset.job!=null){S.jobIndex=+t.dataset.job;go('job');return}
  // выбор фильтра в шите (без закрытия)
  if(t.dataset.jf){S.wf[t.dataset.jf]=t.dataset.jfv||null;openFilterSheet();return}
  // переключатель граф/список
  if(t.dataset.pathview){S.pathView=t.dataset.pathview;render();return}
  // одиночный выбор
  if(t.dataset.pick){S.reg[t.dataset.pick]=t.dataset.val;render();return}
  // мультивыбор
  if(t.dataset.toggle){const key=t.dataset.toggle==='need'?'needs':'skills';const v=+t.dataset.val;const arr=S.reg[key];const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);render();return}
  // AI варианты (визуальные)
  if(t.dataset.ai){return}
  // обработка запроса организации
  if(t.dataset.handle!=null){S._handled=(S._handled||[]).concat(+t.dataset.handle);toast(+t.dataset.ok?T().org.confirmed:T().org.rejected);render();return}
  // действия
  const a=t.dataset.action;
  if(a==='login'){S.registered=true;go('home')}
  else if(a==='create-account'){go('reg-status')}
  else if(a==='enter'){S.registered=true;go('home')}
  else if(a==='apply'){toast(T().od.applied)}
  else if(a==='respond'){toast(t.dataset.msg||T().wk.taken)}
  else if(a==='open-filters'){openFilterSheet()}
  else if(a==='reset-filters'){S.wf={company:null,fmt:null,city:null};openFilterSheet()}
  else if(a==='apply-filters'){closeSheet();render()}
  else if(a==='notify'){toast(T().od.notify+' ✓')}
  else if(a==='ai-path'){S.goal=T().p.empty_ph.replace(/^[^:]*:\s*/,'');S.goal=S.lang==='ru'?'Фулл-стак разработчик':'Барномасози Full-stack';go('path')}
  else if(a==='build-path'){const inp=document.getElementById('goalInput');S.goal=(inp&&inp.value.trim())||(S.lang==='ru'?'Фулл-стак разработчик':'Барномасози Full-stack');go('path')}
  else if(a==='rebuild'){S.goal=null;go('path')}
  else if(a==='copy'){const link='imkon.tj/u/'+(S.reg.name||'shuhrat').toLowerCase();(navigator.clipboard&&navigator.clipboard.writeText(link).catch(()=>{}));toast(T().sh.copied)}
  else if(a==='toggle-vis'){S.visible=!S.visible;render()}
  else if(a==='invite'){toast(T().pub.invited)}
  else if(a==='publish-gig'){toast(T().gig.published);setTimeout(()=>go('work'),700)}
  else if(a==='toast'){toast(t.dataset.msg||'✓')}
});

/* ---------- ввод имени ---------- */
document.body.addEventListener('input',e=>{const m=e.target.closest('[data-model]');if(m){S.reg[m.dataset.model]=e.target.value}});

/* старт */
if(!S.registered && S.screen!=='welcome' && S.screen!=='signup' && S.screen.indexOf('reg')<0 && S.screen!=='done') S.screen='welcome';
render();
</script>
</body>
</html>
