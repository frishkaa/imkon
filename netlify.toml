# Netlify config — hosts the FRONTEND only (the backend lives on Render, see DEPLOY.md).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA client-side routing: every path falls back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set this in Netlify UI (Site settings → Environment variables), NOT here:
#   VITE_API_BASE = https://<your-backend>.onrender.com
