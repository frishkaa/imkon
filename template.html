<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Имкон · шаблон экрана</title>

<!-- 1) Шрифты -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- 2) Токены + компоненты -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">

<style>
  /* раскладка холста для превью — НЕ часть дизайн-системы */
  body { display: flex; justify-content: center; padding: 60px 20px; }
</style>
</head>

<body class="im-canvas">

  <!-- ====== СКОПИРУЙ ЭТОТ БЛОК .im-phone, ЧТОБЫ НАЧАТЬ НОВЫЙ ЭКРАН ====== -->
  <div class="im-phone">

    <!-- строка статуса -->
    <div class="im-statusbar"><span>9:41</span><span class="dots">●●●</span></div>

    <!-- хедер шага: стрелка назад + прогресс (убери, если экран без шагов) -->
    <div class="im-row" style="padding:18px 24px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div class="im-progress"><i style="width:33%"></i></div>
    </div>

    <!-- контент экрана -->
    <div class="im-screen">
      <div class="im-pad" style="padding-top:30px; flex:1">
        <div class="im-step">{{step}} 2 / 6</div>
        <div class="im-q" style="margin-top:14px" data-i18n="q">Сколько тебе лет?</div>

        <!-- ↓↓↓ ТВОЙ КОНТЕНТ ЗДЕСЬ ↓↓↓ -->
        <div class="im-grid-2" style="margin-top:26px">
          <button class="im-btn im-btn--ghost" style="padding:22px 0;font-size:19px;color:var(--ink)">14–17</button>
          <button class="im-btn im-btn--ghost" style="padding:22px 0;font-size:19px;color:var(--ink)">18–22</button>
          <button class="im-btn im-btn--ghost" style="padding:22px 0;font-size:19px;color:var(--ink)">23–27</button>
          <button class="im-btn im-btn--ghost" style="padding:22px 0;font-size:19px;color:var(--ink)">28–35</button>
        </div>
        <!-- ↑↑↑ ТВОЙ КОНТЕНТ ЗДЕСЬ ↑↑↑ -->
      </div>

      <!-- футер с кнопками -->
      <div class="im-foot">
        <div class="im-btn-row">
          <button class="im-btn im-btn--ghost" data-i18n="back">Назад</button>
          <button class="im-btn im-btn--primary im-btn--grow" data-i18n="next">Далее</button>
        </div>
      </div>
    </div>

  </div>
  <!-- ====== КОНЕЦ ЭКРАНА ====== -->

  <!-- Тумблер языка для превью (вне рамки) -->
  <div style="position:fixed; top:20px; right:24px">
    <div class="im-pills">
      <button class="im-pill" data-lang="tg">Тоҷикӣ</button>
      <button class="im-pill is-on" data-lang="ru">Русский</button>
    </div>
  </div>

  <script>
    /* Минимальный двуязычный движок: data-i18n="key" + словарь TR.
       Бэкенд НЕ нужен — это только для макета. */
    const TR = {
      ru: { step:'Шаг', back:'Назад', next:'Далее', q:'Сколько тебе лет?' },
      tg: { step:'Қадам', back:'Бозгашт', next:'Идома', q:'Чанд сола ҳастӣ?' },
    };
    function setLang(lang){
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const v = TR[lang][el.dataset.i18n];
        if (v != null) el.textContent = v;
      });
      document.querySelectorAll('.im-pill').forEach(p=>p.classList.toggle('is-on', p.dataset.lang===lang));
    }
    document.querySelectorAll('.im-pill').forEach(p=>p.addEventListener('click',()=>setLang(p.dataset.lang)));
  </script>
</body>
</html>
